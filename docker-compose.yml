# Postgres + both APIs. The Next.js till runs with `npm run dev` in web/.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - ./docker/create-databases.sql:/docker-entrypoint-initdb.d/create-databases.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 30

  erp:
    build: ./erp
    environment:
      ERP_DATABASE_URL: postgresql+psycopg://app:app@db:5432/erp
      ERP_FAIL_RATE: ${ERP_FAIL_RATE:-0}
    command: sh -c "python -m erp_service.cli seed && uvicorn --factory erp_service.main:create_app --host 0.0.0.0 --port 8001"
    ports: ["8001:8001"]
    depends_on:
      db: {condition: service_healthy}

  pos:
    build: ./pos
    environment: &pos-env
      POS_DATABASE_URL: postgresql+psycopg://app:app@db:5432/pos
      POS_ERP_BASE_URL: http://erp:8001
    command: sh -c "python -m pos_service.cli init-db && uvicorn --factory pos_service.main:create_app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      erp: {condition: service_started}

  # Retries queued ERP pushes once a minute.
  pos-push-worker:
    build: ./pos
    environment: *pos-env
    command: sh -c "while true; do python -m pos_service.cli push-pending; sleep 60; done"
    depends_on:
      pos: {condition: service_started}

volumes:
  pgdata:
